steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sleepvia-backend:$SHORT_SHA', './backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sleepvia-backend:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sleepvia-frontend:$SHORT_SHA', './frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sleepvia-frontend:$SHORT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud container clusters get-credentials $CLUSTER_NAME --zone $CLUSTER_ZONE --project $PROJECT_ID
        sed -i "s|gcr.io/PROJECT_ID/sleepvia-backend:1.0|gcr.io/$PROJECT_ID/sleepvia-backend:$SHORT_SHA|g" k8s/backend-deployment.yaml
        sed -i "s|gcr.io/PROJECT_ID/sleepvia-frontend:1.0|gcr.io/$PROJECT_ID/sleepvia-frontend:$SHORT_SHA|g" k8s/frontend-deployment.yaml
        kubectl apply -f k8s/

substitutions:
  _CLUSTER_NAME: "sleepvia-cluster"
  _CLUSTER_ZONE: "us-central1-a"
options:
  substitutions: true
timeout: 1200s
