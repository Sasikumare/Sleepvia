name: Build, Push and Deploy to GKE

on:
  push:
    branches: [ develop ]

env:
  PROJECT_ID: project-8dc10e91-6100-4532-bb6
  REPO_LOCATION: us-west1
  REPO_NAME: sleepvia-repo
  CLUSTER_NAME: sleepvia-cluster
  CLUSTER_ZONE: us-west1-a

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: kubectl

      - name: Docker auth
        run: |
          gcloud auth configure-docker $REPO_LOCATION-docker.pkg.dev --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --zone $CLUSTER_ZONE \
            --project $PROJECT_ID

      # -------------------------
      # Build & Push Backend
      # -------------------------
      - name: Build backend
        run: |
          docker build -t $REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/sleepvia-backend:${GITHUB_SHA} ./backend

      - name: Push backend
        run: |
          docker push $REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/sleepvia-backend:${GITHUB_SHA}

      # -------------------------
      # Build & Push Frontend
      # -------------------------
      - name: Build frontend
        run: |
          docker build -t $REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/sleepvia-frontend:${GITHUB_SHA} ./frontend

      - name: Push frontend
        run: |
          docker push $REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/sleepvia-frontend:${GITHUB_SHA}

      # -------------------------
      # Deploy to GKE
      # -------------------------
      - name: Deploy to GKE
        run: |

          BACKEND_IMAGE=$REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/sleepvia-backend:${GITHUB_SHA}
          FRONTEND_IMAGE=$REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/sleepvia-frontend:${GITHUB_SHA}

          echo "Deploying backend: $BACKEND_IMAGE"
          echo "Deploying frontend: $FRONTEND_IMAGE"

          kubectl set image deployment/sleepvia-backend backend=$BACKEND_IMAGE
          kubectl set image deployment/sleepvia-frontend frontend=$FRONTEND_IMAGE

          kubectl rollout status deployment/sleepvia-backend --timeout=300s
          kubectl rollout status deployment/sleepvia-frontend --timeout=300s

      - name: Verify
        run: |
          kubectl get pods
          kubectl get deployments