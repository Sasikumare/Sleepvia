name: Build and Push to Artifact Registry

on:
  push:
    branches: [ develop ]

env:
  PROJECT_ID: project-8dc10e91-6100-4532-bb6
  REPO_LOCATION: us-west1
  REPO_NAME: sleepvia-repo
  CLUSTER_NAME: sleepvia-cluster
  CLUSTER_ZONE: us-west1-a

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: kubectl

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone ${{ env.CLUSTER_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REPO_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/sleepvia-backend:latest
            ${{ env.REPO_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/sleepvia-backend:${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REPO_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/sleepvia-frontend:latest
            ${{ env.REPO_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/sleepvia-frontend:${{ github.sha }}
          platforms: linux/amd64

      - name: Install cert-manager (one-time setup)
        run: |
          if ! kubectl get deployment cert-manager -n cert-manager &>/dev/null; then
            echo "Installing cert-manager..."
            helm repo add jetstack https://charts.jetstack.io 2>/dev/null || true
            helm repo update
            kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.crds.yaml
            helm upgrade --install cert-manager jetstack/cert-manager \
              --namespace cert-manager \
              --version v1.13.0 \
              --wait
            echo "cert-manager installed successfully"
          else
            echo "cert-manager already installed"
          fi

      - name: Apply cert-manager issuer
        run: |
          kubectl get clusterissuer letsencrypt-prod || kubectl apply -f k8s/cert-issuer.yaml

      - name: Deploy updated images to GKE
        run: |
          PROJECT_ID=${{ env.PROJECT_ID }} envsubst < k8s/backend-deployment.yaml | kubectl apply -f -
          PROJECT_ID=${{ env.PROJECT_ID }} envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/sleepvia-backend --timeout=120s
          kubectl rollout status deployment/sleepvia-frontend --timeout=120s

      - name: Print pushed image tags
        run: |
          echo "backend: ${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/sleepvia-backend:${GITHUB_SHA}" || true
          echo "frontend: ${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/sleepvia-frontend:${GITHUB_SHA}" || true
